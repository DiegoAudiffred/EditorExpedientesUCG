<div class="row d-flex  border border-3 rounded-4 shadow-lg border-primary my-3 p-3"
    id="filtros-expedientes" data-url="{% url 'Index:filtrar_expedientes_ajax' %}">

<div class="col-lg-2 col-6">
    <div class="fnSuperiorRegularTitle3 text-quinto">Estatus</div>
    
    <input type="hidden" id="estatus-select" value="0">

    <div class="dropdown w-100">
        <button class="btn w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero d-flex align-items-center justify-content-between dropdown-toggle bg-white" 
                type="button" 
                id="dropdownEstatus" 
                data-bs-toggle="dropdown" 
                aria-expanded="false">
            <span id="selected-option-estatus" class="d-flex align-items-center gap-2">Todos</span>
        </button>
        <ul class="dropdown-menu w-100" aria-labelledby="dropdownEstatus">
            <li>
                <a class="dropdown-item d-flex align-items-center gap-2" href="javascript:void(0)" onclick="seleccionarEstatus('0', 'Todos', '')">
                    Todos
                </a>
            </li>
            {% for option in estatus %}
            <li>
                <a class="dropdown-item d-flex align-items-center gap-2" href="javascript:void(0)" onclick="seleccionarEstatus('{{option.id}}', '{{option.nombre}}', '{{option.color}}')">
                    <div style="background-color: {{option.color}}; width: 20px; height: 20px;" class="border border-2 border-quinto rounded-circle pe-3"></div>
                    <span class="text-break text-truncate">{{option.nombre}}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>

    <div class="col-lg-2 col-6">
        <div class="fnSuperiorRegularTitle3 text-quinto">E.Servicios</div>
        <select name="usuarios" id="usuarios-select"
            class="w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero">
            <option value="0">Cualquiera</option>
            {% for option in usuarios %}
            <option value="{{option.id}}">{{option.nombreCompleto}}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-lg-2 col-6">
        <div class="fnSuperiorRegularTitle3 text-quinto">E.Negocios</div>
        <select name="usuariosNegocios" id="usuariosNegocios-select"
            class="w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero">
            <option value="0">Cualquiera</option>
            {% for option in usuariosNegocios %}
            <option value="{{option.id}}">{{option.nombreCompleto}}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-lg-2 col-6">
        <div class="fnSuperiorRegularTitle3 text-quinto">E.Credito</div>
        <select name="usuariosCredito" id="usuariosCredito-select"
            class="w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero">
            <option value="0">Cualquiera</option>
            {% for option in usuariosCredito %}
            <option value="{{option.id}}">{{option.nombreCompleto}}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-lg-2 col-6">
        <div class="fnSuperiorRegularTitle3 text-quinto">Nombre del socio</div>
        <input type="text" id="socio-input"
            class="w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero"
            placeholder="Buscar por nombre">
    </div>

    <div class="col-lg-2 col-6">
        <div class="fnSuperiorRegularTitle3 text-quinto"> Desde</div>
        <input type="date" id="fecha-inicio-input" name="fecha_inicio"
            class="w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero">
    </div>

    <div class="col-lg-2 col-6">
        <div class="fnSuperiorRegularTitle3 text-quinto"> Hasta</div>
        <input type="date" id="fecha-fin-input" name="fecha_fin"
            class="w-100 filtro-input rounded rounded-4 py-1 px-2 border border-2 border-tercero">
    </div>
 <div class="col-lg-2 col-6">
    <div class="fnSuperiorRegularTitle3 text-white"> . </div>
    <button class="btn w-100 rounded rounded-4 p-1 border border-2 border-tercero" id="boton-archivado-datos-faltantes">
        <i class="fa fa-file-text px-2 my-auto" style="color: #FF0000;"></i> Faltantes
    </button>
</div>
    <div class="col-lg-2 col-6">
                <div class="fnSuperiorRegularTitle3 text-white"> . </div>

        <button class="btn w-100 rounded rounded-4 p-1 border border-2 border-tercero" id="boton-atrasados-datos">
            
            <i class="fa fa-hourglass" aria-hidden="true" style="color: #e67e22;"></i> Atrasados
        </button>
    </div>

    <div class="col-lg-2 col-6">
                <div class="fnSuperiorRegularTitle3 text-white"> . </div>

        <button class="btn w-100 rounded rounded-4 p-1 border border-2 border-tercero" id="boton-analizar-datos">
            <i class="fa fa-bar-chart" aria-hidden="true" style="color: #27ae60;"></i> A Analizar
        </button>
    </div>



    <div class="col-lg-2 col-6">
                        <div class="fnSuperiorRegularTitle3 text-white"> . </div>

        <button id="boton-reset-datos" class="btn btn-quinto w-100 rounded rounded-4 p-1" id="boton-analizar-datos">
            Reiniciar
        </button>
    </div>




 </div>


<script>
    function seleccionarEstatus(id, nombre, color) {
    const inputEstatus = document.getElementById('estatus-select');
    const containerText = document.getElementById('selected-option-estatus');
    
    inputEstatus.value = id;
    
    if (color) {
        containerText.innerHTML = `<div style="background-color: ${color}; width: 20px; height: 20px;" class="border border-2 border-quinto rounded-circle"></div> <span>${nombre}</span>`;
    } else {
        containerText.innerHTML = nombre;
    }

    inputEstatus.dispatchEvent(new Event('change'));
}

$(document).ready(function () {
    const filtrosContainer = document.getElementById('filtros-expedientes');
    if (!filtrosContainer) return;

    const filterUrl = filtrosContainer.dataset.url;

    const estatusSelect = document.getElementById('estatus-select');
    const usuariosSelect = document.getElementById('usuarios-select');
    const usuariosNegociosSelect = document.getElementById('usuariosNegocios-select');
    const usuariosCreditoSelect = document.getElementById('usuariosCredito-select');
    const socioInput = document.getElementById('socio-input');
    const fechaInicioInput = document.getElementById('fecha-inicio-input');
    const fechaFinInput = document.getElementById('fecha-fin-input');
    const botonReset = document.getElementById('boton-reset-datos');
    const botonAtrasados = document.getElementById('boton-atrasados-datos');
    const botonAnalizar = document.getElementById('boton-analizar-datos');
    const botonFaltantes = document.getElementById('boton-archivado-datos-faltantes');

    let atrasadosActivo = false;
    let contempladosActivo = false;
    let faltantesActivo = false;

    function actualizarEstiloBoton(boton, activo) {
        if (activo) {
            boton.classList.add('bg-primary', 'text-white');
        } else {
            boton.classList.remove('bg-primary', 'text-white');
        }
    }

    function ejecutarFiltro(page = 1) {
        const params = {
            'estatus': estatusSelect.value,
            'usuarios': usuariosSelect.value,
            'usuariosNegocios': usuariosNegociosSelect ? usuariosNegociosSelect.value : '0',
            'usuariosCredito': usuariosCreditoSelect.value,
            'socio': socioInput.value,
            'fecha_inicio': fechaInicioInput.value,
            'fecha_fin': fechaFinInput.value,
            'page': page,
            'expedienteResagado': atrasadosActivo ? '1' : '0',
            'contemplado': contempladosActivo ? '1' : '0',
            'archivadoFaltantes': faltantesActivo ? '1' : '0'
        };

        $.ajax({
            url: filterUrl,
            type: 'GET',
            data: params,
            success: function (response) {
                $('#resultados-expedientes').html(response);
            },
            error: function (xhr, status, error) {
                console.error("Error AJAX:", error);
            }
        });
    }

    function resetearFiltros() {
        estatusSelect.value = "0";
        document.getElementById('selected-option-estatus').innerHTML = "Todos";
        usuariosSelect.value = "0";
        if (usuariosNegociosSelect) usuariosNegociosSelect.value = "0";
        usuariosCreditoSelect.value = "0";
        socioInput.value = "";
        fechaInicioInput.value = "";
        fechaFinInput.value = "";

        atrasadosActivo = false;
        contempladosActivo = false;
        faltantesActivo = false;
        actualizarEstiloBoton(botonAtrasados, false);
        actualizarEstiloBoton(botonAnalizar, false);
        if (botonFaltantes) actualizarEstiloBoton(botonFaltantes, false);

        ejecutarFiltro(1);
    }

    if (botonAtrasados) {
        botonAtrasados.addEventListener('click', function (e) {
            e.preventDefault();
            atrasadosActivo = !atrasadosActivo;
            actualizarEstiloBoton(botonAtrasados, atrasadosActivo);
            ejecutarFiltro(1);
        });
    }

    if (botonAnalizar) {
        botonAnalizar.addEventListener('click', function (e) {
            e.preventDefault();
            contempladosActivo = !contempladosActivo;
            actualizarEstiloBoton(botonAnalizar, contempladosActivo);
            ejecutarFiltro(1);
        });
    }

    if (botonFaltantes) {
        botonFaltantes.addEventListener('click', function (e) {
            e.preventDefault();
            faltantesActivo = !faltantesActivo;
            actualizarEstiloBoton(botonFaltantes, faltantesActivo);
            ejecutarFiltro(1);
        });
    }

    estatusSelect.addEventListener('change', () => ejecutarFiltro(1));
    usuariosSelect.addEventListener('change', () => ejecutarFiltro(1));
    if (usuariosNegociosSelect) usuariosNegociosSelect.addEventListener('change', () => ejecutarFiltro(1));
    usuariosCreditoSelect.addEventListener('change', () => ejecutarFiltro(1));
    fechaInicioInput.addEventListener('change', () => ejecutarFiltro(1));
    fechaFinInput.addEventListener('change', () => ejecutarFiltro(1));

    let timeoutId;
    socioInput.addEventListener('input', function () {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => ejecutarFiltro(1), 300);
    });

    if (botonReset) botonReset.addEventListener('click', resetearFiltros);

    $(document).on('click', '.paginar', function (e) {
        e.preventDefault();
        const page = $(this).data('page');
        ejecutarFiltro(page);
    });

    ejecutarFiltro(1);
});
</script>

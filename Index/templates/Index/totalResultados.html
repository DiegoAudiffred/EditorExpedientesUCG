<div class="card mb-4 shadow-lg border border-3 border-primary bg-cuarto">
    <div class="card-body">
        <div class="row text-center g-3">
            <div class="col-6 col-md-2">
                <div class="p-2 border rounded bg-white border-quinto border-5">
                    <small class=" d-block fw-bold">TOTAL REGISTROS</small>
                    <span class="fs-4 fw-bold text-dark">{{ totalRegistros }}</span>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="p-2 border rounded bg-white border-quinto border-5">
                    <small class="text-success d-block fw-bold">LLENADOS</small>
                    <span class="fs-4 fw-bold text-black">{{ totalRegistrosLlenos }}</span>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="p-2 border rounded bg-white border-quinto border-5">
                    <small class="text-warning-emphasis d-block fw-bold">VACÍOS</small>
                    <span class="fs-4 fw-bold text-warning-emphasis">{{ totalRegistrosVacios }}</span>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="p-2 border rounded bg-white border-quinto border-5">
                    <small class="text-dark d-block fw-bold">NO APLICAN</small>
                    <span class="fs-4 fw-bold text-dark">{{ totalRegistrosNA }}</span>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="p-2 border rounded bg-white border-quinto border-5">
                    <small class="text-dark d-block fw-bold">% Completado</small>
                    <span class="fs-4 fw-bold 
            {% if porcentajeLlenado < 50 %}
                text-red
            {% elif porcentajeLlenado >= 50 and porcentajeLlenado < 100 %}
                text-yellow
            {% elif porcentajeLlenado >= 100 %}
                text-green
            {% endif %}">
                        {{ porcentajeLlenado }}%
                    </span>
                </div>
            </div>
        </div>

        {% if mensajeInfo %}
        <div class="alert alert-warning mt-3 mb-0 text-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ mensajeInfo }}
        </div>
        {% endif %}
    </div>
</div>

<button type="button" class="btn btn-secondary text-white w-100 my-2" data-bs-toggle="modal" data-bs-target="#modalExportarPDF">
    Exportar a PDF
</button>



<div class="modal fade" id="modalExportarPDF" tabindex="-1" aria-labelledby="modalExportarPDFLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="modalExportarPDFLabel">Confirmar Exportación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-4 text-center">
                <i class="bi bi-file-earmark-pdf fs-1 text-dark mb-3 d-block"></i>
                <p class="mb-0 text-dark">¿Estás seguro de que deseas exportar los datos de este expediente a formato <strong>PDF</strong>?</p>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-white px-4 rounded-2 border border-3" data-bs-dismiss="modal">Cancelar</button>
                <a href="{% url 'Index:exportarPDF' expediente.id %}" class="btn btn-primary px-4 text-white rounded-2">Sí, exportar</a>
            </div>
        </div>
    </div>
</div>

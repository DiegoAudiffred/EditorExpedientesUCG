<div id="collapseOperativa" class="accordion-collapse collapse" aria-labelledby="headingOperativa"
    data-bs-parent="#acordeonSecciones">
    <div class="accordion-body border border-3 border-cuarto">
        <div class="accordion accordion-flush" id="accordionFlushSecciones">
            {% for item in secciones %}
            <div class="accordion-item">
                <h2 class="accordion-header" id="flush-heading{{item.id}}">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#flush-collapse{{item.id}}" aria-expanded="false"
                        aria-controls="flush-collapse{{item.id}}">
                        Accordion Item #1
                    </button>
                </h2>
                <div id="flush-collapse{{item.id}}" class="accordion-collapse collapse"
                    aria-labelledby="flush-heading{{item.id}}" data-bs-parent="#accordionFlushSecciones">
                    <div class="accordion-body"> 
                        {% if item.seccion.tipoDeSeccion != 'A' and item.seccion.tipoDeSeccion != 'B' and item.seccion.tipoDeSeccion != 'C' and item.seccion.tipoDeSeccion != 'I' and item.seccion.tipoDeSeccion != 'II' %}
                        <ul class="nav nav-pills flex-wrap gap-1" role="tablist">
                            <li class="nav-item border border-primary border-2 bg-secondary fw-bold rounded-3"
                                role="presentation">
                                <button class="nav-link" id="tab-{{ item.seccion.pk }}" data-bs-toggle="tab"
                                    data-bs-target="#seccion-{{ item.seccion.pk }}" type="button" role="tab">
                                    {{ item.seccion.tituloSeccion }} ({{ item.seccion.tipoDeSeccion }})
                                </button>
                            </li>
                        </ul>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
